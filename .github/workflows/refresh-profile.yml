name: Refresh profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "03 6 * * *"

permissions:
  contents: write

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh daily profile signal
        run: node scripts/refresh-profile-readme.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: DilbirinErdem

      - name: Commit README refresh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --cached --quiet; then
            echo "README is already current."
          else
            git commit -m "Refresh profile daily signal"
            git push
          fi
